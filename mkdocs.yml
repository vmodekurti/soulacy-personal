site_name: soulacy
site_description: Step-by-step guides for self-hosted agents, iPhone setup, reviewed learning, Safe Undo, and verified automation.
site_url: https://docs.soulacy.io
repo_url: https://github.com/vmodekurti/soulacy-personal
repo_name: vmodekurti/soulacy-personal
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/living-core-blue-v1.png
  favicon: assets/living-core-blue-v1.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css


plugins:
  - search

# Internal working documents — never published to the public site.
exclude_docs: |
  validation/**
  brand/**
  *_VALIDATION_*.md
  PRODUCTION_RELEASE_*.md
  LIVING_CORE_RELEASE_*.md
  AGENT_DESIGN.md
  SESSION_HANDOFF.md
  STUDIO_*.md
  BACKLOG.md
  CHANNEL_DESIGN.md
  CLEAN_RUNTIME_UAT_REPORT_*.md
  CRITIQUE_RESPONSE.md
  CUSTOM_DISTRIBUTIONS.md
  EVENTS.md
  EXTENSIBILITY.md
  EXTERNAL_CHANNEL_PROTOCOL.md
  EXTERNAL_STORAGE_PROTOCOL.md
  FLOW_GRAPHS.md
  FOUNDER_QA_REPORT_*.md
  FRAMEWORK_OVERVIEW.md
  FRAMEWORK_PARITY_BACKLOG.md
  INSTALL_UX_GAPS.md
  LAUNCH_STRATEGY.md
  OPENCLAW_PARITY.md
  PACKAGE_REGISTRIES.md
  PACKAGE_VERSIONING_DESIGN.md
  PLUGIN_*.md
  COHORT_*.md
  PRODUCTION_AUDIT.md
  PRODUCTION_PARITY.md
  PRODUCTIZATION_REVIEW.md
  RELEASE_CHECKLIST.md
  RELEASE_NOTES_*.md
  PRODUCT_GUIDE.md
  REASONING_STRATEGIES.md
  REGRESSION_TESTING.md
  RULEBOOKS.md
  SAFETY_INTROSPECTION.md
  SOULACY_*.md
  TUTORIAL.md
  UPGRADE_STABILITY.md
  USER_GUIDE.md
  VASU_OS_FEASIBILITY.md
  VOICE_SPIKE.md
  WORKSPACE.md
  *.html

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://soulacy.io
      name: Main Website (soulacy.io)
    - icon: fontawesome/brands/github
      link: https://github.com/vmodekurti/soulacy-personal
  version:
    provider: mike


