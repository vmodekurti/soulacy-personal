name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "install.sh"
      - "Makefile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      # The installer is served from the docs site root:
      #   curl -fsSL https://vmodekurti.github.io/soulacy/install.sh | bash
      # install.sh is the source of truth; docs/install.sh is the
      # published copy, refreshed on every deploy.
      - name: Build docs strictly
        run: make docs-build

      - name: Build and deploy docs
        run: python3 -m mkdocs gh-deploy --force --strict
