name: Personal source availability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-personal-source:
    name: Public and Personal-only
    runs-on: ubuntu-latest
    steps:
      - name: Refuse private visibility
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo "Soulacy Personal must remain public." >&2
            exit 1
          fi

      - name: Verify anonymous Git access
        env:
          PUBLIC_REPOSITORY: ${{ github.repository }}
        run: |
          env -u GITHUB_TOKEN git ls-remote "https://github.com/${PUBLIC_REPOSITORY}.git" HEAD >/dev/null

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify Developer Certificate of Origin
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Verify Personal-only boundary
        run: bash scripts/check-personal-boundary.sh
