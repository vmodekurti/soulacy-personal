name: Repository boundary

on:
  push:
    branches: [main, "codex/**", "automation/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visibility-and-upstream:
    name: Private extension with public upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse public commercial repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            echo "Soulacy Commercial must remain private." >&2
            exit 1
          fi

      - name: Verify Personal lineage and availability
        run: ./scripts/verify-personal-upstream.sh

      - name: Verify explicit edition dependencies
        run: ./scripts/verify-edition-dependencies.sh

      - name: Verify edition dependency direction
        run: make edition-boundary

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Provide embedded GUI placeholder
        run: |
          mkdir -p internal/webui/dist
          printf '<html><body>CI placeholder</body></html>\n' > internal/webui/dist/index.html

      - name: Install contract-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Verify Personal, Team, and Scale contracts
        run: make deployment-modes-test
