name: Validate cloud deployment assets

on:
  pull_request:
    paths:
      - "deploy/**"
      - "website/**"
      - "scripts/test-cloud-deploy.sh"
      - ".github/workflows/cloud-deploy-assets.yml"
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "website/**"
      - "scripts/test-cloud-deploy.sh"
      - ".github/workflows/cloud-deploy-assets.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate bootstrap, Compose, ARM, and website links
        run: ./scripts/test-cloud-deploy.sh
      - name: Validate CloudFormation
        run: |
          python -m pip install cfn-lint==1.46.0
          cfn-lint deploy/aws/cloudformation.yaml

      - name: Validate ARM template (arm-ttk)
        shell: pwsh
        run: |
          # Test-AzTemplate writes each failed test to the error stream; keep going
          # so the full results table is printed before this step decides.
          $ErrorActionPreference = 'Continue'
          git clone --quiet https://github.com/Azure/arm-ttk.git "$env:RUNNER_TEMP/arm-ttk"
          git -C "$env:RUNNER_TEMP/arm-ttk" checkout --quiet 0ec9a41a4503e970a0ec8efb0cd08415cc172175
          Import-Module "$env:RUNNER_TEMP/arm-ttk/arm-ttk/arm-ttk.psd1"
          $results = Test-AzTemplate -TemplatePath deploy/azure -File azuredeploy.json
          $results | Format-Table -AutoSize Name, Passed, Errors | Out-String -Width 200 | Write-Output
          $failed = @($results | Where-Object { -not $_.Passed })
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Output "::error::arm-ttk failed: $($_.Name) - $($_.Errors -join '; ')" }
            exit 1
          }
