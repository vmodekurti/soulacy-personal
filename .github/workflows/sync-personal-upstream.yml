name: Sync Personal upstream

on:
  schedule:
    - cron: "17 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-personal-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Open Personal update PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch public upstream
        run: |
          git remote add personal https://github.com/vmodekurti/soulacy-personal.git
          git fetch --no-tags personal main

      - name: Prepare synchronization merge
        id: prepare
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < .personal-base)"
          incoming="$(git rev-parse personal/main)"
          echo "incoming=$incoming" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$incoming" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge-base --is-ancestor "$current" personal/main || {
            echo "Recorded Personal base is not an ancestor of Personal main." >&2
            exit 1
          }

          branch="automation/sync-personal"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch" origin/main
          git config user.name "soulacy-upstream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          report="$RUNNER_TEMP/personal-sync-report.md"
          commit_count="$(git rev-list --count "$current..$incoming")"
          changed_files="$(git diff --name-only "$current" "$incoming")"
          count_matches() {
            local pattern="$1"
            printf '%s\n' "$changed_files" | grep -Ec "$pattern" || true
          }
          {
            echo "## Personal dependency update"
            echo
            echo "This proposes a reviewed downstream update; it does **not** auto-merge Personal changes into Commercial."
            echo
            echo "| Dependency | Current | Proposed | Commits |"
            echo "| --- | --- | --- | ---: |"
            echo "| Soulacy Personal | \`$current\` | \`$incoming\` | $commit_count |"
            echo
            echo "### Impact surface"
            echo
            echo "| Surface | Changed files |"
            echo "| --- | ---: |"
            echo "| Go contracts/runtime | $(count_matches '^(go\\.(mod|sum)|pkg/|internal/(config|runtime|studio|gateway)/)') |"
            echo "| Browser/UI | $(count_matches '^gui/') |"
            echo "| Storage/schema | $(count_matches '^(internal/(storage|memory|knowledge)/|migrations/)') |"
            echo "| Build/deployment | $(count_matches '^(\\.github/|Makefile|Dockerfile|deploy/|scripts/)') |"
            echo "| Documentation | $(count_matches '^(README|docs/)') |"
            echo
            echo "### Personal commits"
            echo
            git log --no-merges -n 50 --format='- `%h` %s' "$current..$incoming"
            if [ "$commit_count" -gt 50 ]; then
              echo "- …and $((commit_count - 50)) more commits"
            fi
            echo
            echo "Required review: shared behavior, edition contracts, migrations, security boundaries, and Teams/Scale integration."
          } > "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"

          # A handful of distribution-owned files deliberately differ from
          # Personal. Restore those explicit overlays even when Git could
          # auto-merge them; otherwise a public release edit can silently turn
          # the private updater, image, or signing identity back into Personal.
          set +e
          git merge --no-ff --no-commit personal/main
          merge_status=$?
          set -e
          ./scripts/apply-commercial-overlay.sh origin/main
          if [ "$merge_status" -ne 0 ]; then
            echo "Known Commercial overlays were resolved; checking for unrelated conflicts."
          fi
          printf '%s\n' "$incoming" > .personal-base
          manifest_tmp="$(mktemp)"
          jq --arg revision "$incoming" '.personal.revision = $revision' dependencies/editions.json > "$manifest_tmp"
          mv "$manifest_tmp" dependencies/editions.json
          git add .personal-base dependencies/editions.json
          git commit -m "Sync Personal upstream to ${incoming:0:12}"
          git push --force-with-lease origin "HEAD:$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or refresh pull request
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          INCOMING: ${{ steps.prepare.outputs.incoming }}
          REPORT: ${{ steps.prepare.outputs.report }}
        run: |
          set -euo pipefail
          number="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "Sync Personal upstream" --body-file "$REPORT"
          else
            gh pr create --base main --head "$BRANCH" --title "Sync Personal upstream" --body-file "$REPORT"
          fi
